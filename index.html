<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <script src="https://use.fontawesome.com/1b7d2925a8.js"></script>
</head>

<body>
    <div class="flex flex-col items-center min-h-screen bg-gray-200 justify-center py-10 font-sans">
        <form id="cityForm" class="flex items-center mb-5">
            <input type="search" id="cityInput" placeholder="Search for a city..."
                class="bg-white text-gray-800 placeholder:text-gray-500 border border-gray-300 rounded-l-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit"
                class="bg-blue-500 text-white rounded-r-lg py-2 px-4 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">Search</button>
        </form>
        <div class="bg-gradient-to-br from-indigo-600 to-blue-300 rounded-xl p-4 w-80 shadow overflow-hidden">
            <div class="p-2 mb-2">
                <div class="text-center">
                    <div class='leading-tight text-white'><span class="fa fa-map-marker"></span> <span
                            id="cityName"></span></div>
                </div>
                <div class="text-center">
                    <div class='leading-tight text-gray-300' id="currentDate">Thu 5 December 8:41 am</div>
                </div>
            </div>
            <div class="p-1 mb-1">
                <div class="flex">
                    <div class="flex-1 text-white text-7xl text-center"><span class="fa fa-cloud"></span> <span
                            id="temp"></span>°</div>
                </div>
            </div>
            <div id="hourlyRootContainer" class="hidden">
                <div class="text-xs text-white mb-1">Today</div>
                <div class="p-2 mb-2 bg-indigo-200 rounded-xl flex bg-opacity-20 overflow-x-auto"
                    id="hourlyTempsContainer">
                </div>
            </div>

        </div>
        <script src="./script.js"></script>
    </div>
</body>
</html>
